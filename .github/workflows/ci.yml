# Plantilla de CI. Fijar las versiones del runner y de las acciones al cerrar G-01 y G-17. Las versiones de acciones y de Elixir/OTP se confirman en F0 (F0-01).
name: ci
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # semanal: trabajos weekly-*
jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        otp: ["27", "28"]
        elixir: ["1.19"]
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with: { otp-version: "${{ matrix.otp }}", elixir-version: "${{ matrix.elixir }}" }
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with: { otp-version: "28", elixir-version: "1.19" }
      - run: mix deps.get
      - run: mix xref graph --format stats
      - run: ./scripts/check_boundaries.sh
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/doc_lint.sh
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with: { otp-version: "28", elixir-version: "1.19" }
      - run: mix deps.get
      - run: mix hex.audit
  weekly-deps:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with: { otp-version: "28", elixir-version: "1.19" }
      - run: mix deps.update arrea apero trebejo
      - run: mix test --only gate
