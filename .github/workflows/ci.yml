# CI de Gunther.
#
# Las cuatro capas de verificacion de las convenciones del proyecto (L1
# formato y compilacion, L2 estaticos, L3 pruebas, L4 fronteras y
# documentos) se ejecutan como trabajos separados: un fallo en una capa no
# tapa el de otra.
#
# Versiones fijadas: una sola combinacion, la del toolchain oficial
# (Erlang 28.5.0.7 + Elixir 1.19.5-otp-28; ver `.tool-versions`).
name: ci
on:
  push: { branches: [main] }
  pull_request:
  # Relanzar la CI a mano. Necesario cuando un fallo es de la cuenta y no del
  # codigo (por ejemplo, minutos de Actions agotados): los jobs nacen con
  # `steps: 0` y sin runner, y eso solo se ve relanzando.
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # semanal: trabajos weekly-*

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # L1: formato y compilacion sin warnings.
  l1-format-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5.0.7"
          elixir-version: "1.19.5-otp-28"
      - run: mix deps.get --check-locked
      - run: mix format --check-formatted
      - run: mix compile --force --warnings-as-errors

  # L2: estaticos. Credo y Dialyzer.
  l2-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with: { otp-version: "28.5.0.7", elixir-version: "1.19.5-otp-28" }
      - run: mix deps.get --check-locked
      - run: mix credo --strict --format=oneline
      - run: mix dialyzer

  # L3: pruebas.
  l3-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5.0.7"
          elixir-version: "1.19.5-otp-28"
      - run: mix deps.get --check-locked
      - run: mix test

  # L4: fronteras del nucleo y lint de documento.
  l4-boundaries-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with: { otp-version: "28.5.0.7", elixir-version: "1.19.5-otp-28" }
      - run: mix deps.get --check-locked
      - run: mix xref graph --format stats
      - run: ./scripts/check_boundaries.sh
      - run: ./scripts/doc_lint.sh

  # Auditoria de dependencias: sin vulnerabilidades conocidas.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with: { otp-version: "28.5.0.7", elixir-version: "1.19.5-otp-28" }
      - run: mix deps.get --check-locked
      - run: mix hex.audit

  # El paquete se puede construir y el contenido es el esperado.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with: { otp-version: "28.5.0.7", elixir-version: "1.19.5-otp-28" }
      - run: mix deps.get --check-locked
      - run: mix hex.build
      - run: mix hex.build --unpack -o build
      - name: El paquete no incluye ficheros que no deben
        run: |
          set -euo pipefail
          cd build
          for f in probes _build deps .github erl_crash.dump credo-debug-log.html; do
            if [ -e "$f" ]; then
              echo "FALLO: el paquete contiene $f"
              exit 1
            fi
          done
          echo "OK: el paquete no contiene ficheros de desarrollo"

  # Semanal: las hermanas pueden haber cambiado.
  weekly-deps:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with: { otp-version: "28.5.0.7", elixir-version: "1.19.5-otp-28" }
      - run: mix deps.get
      - run: mix deps.update arrea apero trebejo
      # `deps.update` deja el lock modificado: si las hermanas sacaron algo
      # incompatible, el fallo lo dice la compilacion o las pruebas.
      - run: mix compile --force --warnings-as-errors
      - run: mix test
